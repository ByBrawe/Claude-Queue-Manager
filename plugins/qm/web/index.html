<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer"><title>Queue Manager</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head><body><main class="app">
<header class="topbar"><div class="brand"><strong>Queue Manager</strong><small id="session-id">—</small></div><div class="top-actions"><span id="conn" class="secure" role="status">Connecting</span><select id="locale" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option></select></div></header>
<div class="intro"><h1 id="headline">Your task queue</h1><p id="subtitle">Tasks run one at a time in your current Claude session.</p></div>
<div id="connection-error" class="connection-error hidden" role="alert"></div>
<section id="recovery-panel" class="recovery-notice hidden" role="status"><h2 id="recovery-title"></h2><p id="recovery-task"></p><p id="recovery-hint"></p></section>
<section id="single-panel" class="single-notice hidden" role="status"><strong id="single-title"></strong><p id="single-hint"></p><button id="cancel-single" class="btn soft"></button></section>
<section class="metrics" aria-label="Queue status"><div><span id="metric-pending">Pending</span><strong id="pending-count">—</strong></div><div><span id="metric-active">Active</span><strong id="active-count">—</strong></div><div><span id="metric-done">Completed</span><strong id="done-count">—</strong></div><div><span id="metric-mode">Status</span><strong id="status">—</strong></div></section>
<section class="workspace"><section class="left"><div class="section-header"><h2 id="tasks-title">Pending tasks <span id="selected-badge"></span></h2><button id="toggle-pause" class="btn primary">Pause</button></div><p id="pause-help" class="section-hint"></p><div class="toolbar"><input id="search" type="search" aria-label="Search tasks"><button id="select-all" class="btn soft">Select visible</button><button id="undo-selection" class="btn soft">Clear selection</button></div><div id="batch-actions" class="batch-actions hidden"><strong id="selected-label"></strong><button id="run-selected" class="btn primary hidden"></button><button id="move-top" class="btn soft"></button><button id="move-bottom" class="btn soft"></button><button id="delete-selected" class="btn danger"></button></div><p id="drag-tip" class="section-hint"></p><div id="task-list" class="task-list"></div><footer class="queue-footer"><span id="queue-count"></span><span id="queue-hint"></span></footer></section>
<aside class="right"><section class="card"><h2 id="add-title">Add tasks</h2><p id="add-help" class="muted small"></p><label class="sr-only" for="tasks-input" id="tasks-label">Tasks</label><textarea id="tasks-input" rows="5"></textarea><p id="add-behavior" class="behavior"></p><button id="add-tasks" class="btn primary full"></button><p id="limit" class="muted tiny"></p></section><section class="card"><h2 id="repeat-title">Repeat a message</h2><label id="repeat-count-label" for="repeat-count">Count</label><input id="repeat-count" type="number" min="1" max="200" value="5"><label id="repeat-message-label" for="repeat-message">Message</label><textarea id="repeat-message" rows="3"></textarea><button id="repeat-add" class="btn soft full">Add repetitions</button></section><section class="card"><h2 id="current-title">Current task</h2><h3 id="active-title"></h3><p id="active-subtitle" class="muted small"></p></section></aside></section>
<p id="stall-notice" class="notice hidden" role="status"></p><p id="backup-error" class="notice hidden" role="alert"></p>
<details class="details" id="backup-details"><summary id="backup-title">Backups</summary><div class="settings-actions"><button type="button" id="backup-refresh" class="btn soft"></button><button type="button" id="backup-export" class="btn soft"></button><button type="button" id="backup-redo" class="btn soft"></button></div><label for="backup-file" id="backup-import-label"></label><input id="backup-file" type="file" accept="application/json,.json"><label for="backup-select" id="backup-select-label"></label><select id="backup-select"><option value="">—</option></select><p id="backup-status" role="status" aria-live="polite"></p><section id="backup-preview" hidden><p id="backup-warning"></p><pre id="backup-content"></pre><button type="button" id="backup-restore" class="btn primary"></button><button type="button" id="backup-cancel" class="btn soft"></button></section></details>
<details class="details" id="settings-details"><summary id="settings-title">Advanced settings</summary><p id="settings-hint" class="small"></p><p id="settings-defaults-hint" class="small muted"></p><form id="settings-form"><fieldset id="settings-fields"><div class="settings-grid"><div class="setting-field"><label id="setting-label-verify" for="setting-verify"></label><select id="setting-verify" ></select></div>
<div class="setting-field"><label id="setting-label-model" for="setting-model"></label><input id="setting-model" type="text" maxlength="100"></div>
<div class="setting-field"><label id="setting-label-retries" for="setting-retries"></label><input id="setting-retries" type="number" min="0" max="5" step="1"></div>
<div class="setting-field"><label id="setting-label-retryDelay" for="setting-retryDelay"></label><input id="setting-retryDelay" type="number" min="0" max="600" step="0.001"></div>
<div class="setting-field"><label id="setting-label-timeout" for="setting-timeout"></label><input id="setting-timeout" type="number" min="0" max="86400" step="0.001"></div>
<div class="setting-field"><label id="setting-label-contextPercent" for="setting-contextPercent"></label><input id="setting-contextPercent" type="number" min="0" max="99" step="1"></div>
<div class="setting-field"><label id="setting-label-onFail" for="setting-onFail"></label><select id="setting-onFail" ></select></div></div></fieldset><p id="settings-retry-hint" class="small muted"></p><p id="settings-ai-hint" class="small muted"></p><p id="settings-status" role="status" aria-live="polite"></p><div class="settings-actions"><button type="submit" id="settings-save" class="btn primary">Save settings</button><button type="button" id="settings-reset" class="btn soft">Reload saved settings</button><button type="button" id="settings-defaults" class="btn soft">Reset to defaults</button><button type="button" id="settings-retry-last" class="btn soft">Requeue last failed task</button></div></form></details>
<details class="details"><summary id="analytics-title">History and analytics</summary><p id="context-panel"></p><p id="stats-panel"></p><div id="history-panel"></div><p id="privacy"></p></details>
<div hidden><span id="eyebrow-tasks"></span><span id="eyebrow-active"></span><span id="eyebrow-add"></span><span id="eyebrow-analytics"></span><span id="eyebrow-privacy"></span></div>
<div id="toast" role="status" aria-live="polite"></div><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><div class="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button id="cancel-confirm" class="btn soft"></button><button id="confirm-delete" class="btn danger"></button></div></div></div></main></body></html>
