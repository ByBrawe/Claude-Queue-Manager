name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - run: npm install --global @anthropic-ai/claude-code@2.1.322
      - run: npm run validate:mod
      - run: npm run test:host
